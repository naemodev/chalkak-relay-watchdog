name: a1-hunter
# Oracle A1.Flex(무료 4코어/24GB) capacity 가 날 때까지 24/7 자동 시도.
#   한 번 실행이 내부에서 ~18분간 60초마다 재시도 → 15분마다 재실행으로 사실상 연속.
#   이미 chalkak-relay-a1 인스턴스가 있으면 건너뜀(중복 생성·과금 방지).
#   ★ 알림은 "성공" 때만 텔레그램. 실패(capacity/연결오류/throttle 등)는 전부 로그에만(스팸 방지).
#   Secrets: OCI_CLI_* (기존) + A1_SUBNET, A1_SSH_PUBKEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
concurrency:
  group: a1-hunter
  cancel-in-progress: false
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 21
    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      T: ${{ secrets.OCI_CLI_TENANCY }}
      SUBNET: ${{ secrets.A1_SUBNET }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli
      - name: Hunt A1 capacity (tight loop ~18min)
        run: |
          NAME="chalkak-relay-a1"
          notify() { [ -n "$TG_TOKEN" ] && curl -s "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" -d text="$1" >/dev/null || true; }

          # 이미 인스턴스 있으면 종료(중복 방지)
          EXIST=$(oci compute instance list --compartment-id "$T" \
            --display-name "$NAME" --query "data[?\"lifecycle-state\"!='TERMINATED'] | length(@)" --raw-output 2>/dev/null || echo 0)
          if [ "${EXIST:-0}" != "0" ]; then echo "이미 $NAME 존재 — 종료"; exit 0; fi

          # 최신 Ubuntu 22.04 A1 이미지
          IMAGE=$(oci compute image list --compartment-id "$T" \
            --operating-system "Canonical Ubuntu" --operating-system-version "22.04" \
            --shape "VM.Standard.A1.Flex" --sort-by TIMECREATED --sort-order DESC \
            --query 'data[0].id' --raw-output 2>/dev/null || echo "")
          echo "IMAGE=$IMAGE"
          if [ -z "$IMAGE" ] || [ "$IMAGE" = "null" ]; then
            echo "⚠ 이미지 조회 실패(일시적 연결 오류 가능) — 이번 회차 건너뜀, 다음 실행에서 재시도"
            exit 0
          fi

          ADS=$(oci iam availability-domain list --query 'data[].name' --raw-output | tr -d '[]"," ')
          echo "ADS=$ADS"
          echo "${{ secrets.A1_SSH_PUBKEY }}" > /tmp/a1.pub

          DEADLINE=$(( $(date +%s) + 18*60 ))
          ATTEMPT=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            ATTEMPT=$((ATTEMPT+1))
            for AD in $ADS; do
              if oci compute instance launch \
                --availability-domain "$AD" --compartment-id "$T" \
                --shape "VM.Standard.A1.Flex" --shape-config '{"ocpus":1,"memoryInGBs":6}' \
                --image-id "$IMAGE" --subnet-id "$SUBNET" --assign-public-ip true \
                --display-name "$NAME" --ssh-authorized-keys-file /tmp/a1.pub \
                --connection-timeout 60 --read-timeout 60 \
                > /tmp/launch.json 2>/tmp/launch.err; then
                echo "✅ 생성 성공! ($AD)"
                notify "✅ chalkak A1 인스턴스 생성 성공! ($AD) — 콘솔에서 public IP 확인 후 릴레이 이전 시작"
                exit 0
              fi
              # 실패는 종류 불문 로그에만 (capacity / 연결오류 / 429 등) — 알림 안 함
              ERR=$(head -c 600 /tmp/launch.err)
              echo "[$ATTEMPT][$AD] 실패: $ERR"
              if echo "$ERR" | grep -qi "TooManyRequests"; then
                echo "  → 429 throttle, 90초 백오프"
                sleep 90
              fi
            done
            sleep 60
          done
          echo "이번 회차(${ATTEMPT}회) 미생성 — capacity 대기 중(다음 실행에서 계속)"
